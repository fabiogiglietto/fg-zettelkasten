name: Update vault

on:
  # Pipeline chain (see PIPELINE.md). fg-zettelkasten runs twice:
  #   pipeline-summarize (from toread)    -> `summarize`, then kick research-radio
  #   pipeline-finalize  (from github.io) -> `update` (themes, notes, Slack)
  repository_dispatch:
    types: [pipeline-summarize, pipeline-finalize]
  schedule:
    - cron: "0 5 * * *"      # daily fallback in case a dispatch is missed
    - cron: "0 4 * * 1"      # weekly Mon 04:00 UTC — refresh topics + recluster
  workflow_dispatch:
    inputs:
      recluster:
        description: "Force a full recluster"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write          # deploy the Quartz site to GitHub Pages
  id-token: write       # required by actions/deploy-pages

# Run JS actions on Node 24. Node 20 is deprecated on GitHub runners (forced
# off 2026-06-02); some actions here (deploy-pages, upload-pages-artifact)
# have no Node-24 release yet, so opt in explicitly. No-op once Node 24 is
# the runner default — safe to drop then.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

# Avoid overlapping runs (dispatch + cron)
concurrency:
  group: update-vault
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        # requirements.lock is compiled from requirements.txt (uv pip compile);
        # regenerate it when requirements.txt changes.
        run: pip install -r requirements.lock

      - name: Write Google service-account credentials
        run: printf '%s' '${{ secrets.GOOGLE_CREDENTIALS_JSON }}' > credentials.json

      - name: Run
        env:
          # Authenticates feed_client's GitHub Contents API reads, lifting the
          # rate limit from 60/h (shared-runner-IP, exhausted by other tenants
          # -> intermittent 403) to 5000/h per token.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Workload Identity Federation — no API key. The SDK exchanges the
          # OIDC token minted below for a short-lived access token. Do not
          # reintroduce ANTHROPIC_API_KEY here: it outranks federation in the
          # credential chain and would silently shadow it.
          ANTHROPIC_FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          ANTHROPIC_ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          # Required when the federation rule is scoped to more than one
          # workspace: without it the token exchange 401s. Harmless when the
          # rule resolves to a single workspace, and empty if the var is unset.
          ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
          ANTHROPIC_IDENTITY_TOKEN_FILE: ${{ runner.temp }}/anthropic-oidc-jwt
          GOOGLE_APPLICATION_CREDENTIALS: ./credentials.json
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          # Team fork: mine-toread uploads team-submitted PDFs here and
          # main.py searches it alongside the Paperpile folder. Unset on the
          # fg chain (harmless empty).
          SLACK_INBOX_DRIVE_FOLDER_ID: ${{ secrets.SLACK_INBOX_DRIVE_FOLDER_ID }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          # The OIDC assertion is single use: Anthropic burns its `jti` on the
          # first token exchange and rejects a replay with `jti_reused`. Each
          # `python -m src.main` below is a separate process with its own
          # credential cache, so each performs its own exchange — mint a fresh
          # JWT before every one. The weekly recluster leg runs two commands and
          # the second replayed the first's token, which is what 401'd on
          # 2026-08-24; that leg had never run under federation before then.
          mint() { bash .github/scripts/mint-oidc-token.sh; }
          # A minted JWT lives 5 minutes, but `update --recluster` is a single
          # process that runs ~10 (269 papers on 2026-08-24). When the SDK
          # refreshes its access token it re-reads this file, so one mint per
          # process is not enough either: it would find an assertion that is
          # both expired and already burned. Keep the file stocked.
          # 60s, not research-radio's 120s: the SDK begins its advisory refresh
          # at 120s remaining and hard-fails at 30s, so a 120s rotation can
          # leave a burned token in place for most of that window.
          # Detached with output redirected — a background process holding the
          # step's stdout open can stall step teardown. `|| true` keeps a
          # transient failure from killing the loop under `set -e`.
          ( while true; do sleep 60; OIDC_ECHO_CLAIMS=0 mint || true; done ) >/dev/null 2>&1 &
          if [ "${{ github.event.action }}" = "pipeline-summarize" ]; then
            mint
            python -m src.main summarize
          elif [ "${{ github.event.schedule }}" = "0 4 * * 1" ] || [ "${{ inputs.recluster }}" = "true" ]; then
            mint
            python -m src.main refresh-topics
            mint
            python -m src.main update --recluster
          else
            mint
            python -m src.main update
          fi

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add vault/ data/
          git diff --staged --quiet || git commit -m "🤖 Update vault $(date -u +%Y-%m-%dT%H:%MZ)"
          # main may have moved during the (long) update step; vault/data paths
          # are only written by this job, so a rebase is conflict-free.
          git pull --rebase origin main
          git push

      # Summarize leg only: kick research-radio so it builds the podcast from
      # the summary just committed. The update leg ends the chain — no dispatch.
      - name: Trigger research-radio
        # Skipped outright where there is no podcast leg. The MINE fork has
        # none — research-radio never sources the Slack-inbox folder, so a
        # team paper never gets an episode — and its dispatch token has no
        # access to that repo, so the step failed and took the Quartz build
        # and the Pages deploy behind it down with it. It went unnoticed
        # because `pipeline-summarize` had never been dispatched there: every
        # earlier run was `pipeline-finalize`, which this `if` already skips.
        #
        # A gate rather than `continue-on-error`: soft-failing would still
        # make a doomed API call and still red the step on every run, which is
        # silencing the symptom. Unset means enabled, so the fg chain is
        # unaffected; the fork sets PODCAST_CHAIN_ENABLED=false.
        if: >-
          github.event.action == 'pipeline-summarize'
          && vars.PODCAST_CHAIN_ENABLED != 'false'
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.PIPELINE_DISPATCH_TOKEN }}
          repository: fabiogiglietto/research-radio
          event-type: pipeline-tick

      # Publish the vault as a public website (Quartz -> GitHub Pages).
      # Built fresh from the working tree just committed above; the generated
      # HTML is never committed.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Export vault to Quartz content
        run: python -m src.main export-site

      - name: Build Quartz site
        working-directory: quartz
        run: |
          npm ci
          npx quartz build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: quartz/public

      # Pages deploys fail transiently on the service side ("Deployment
      # failed, try again later") — e.g. 2026-07-03, three sites, all
      # recovered on plain retry. One automatic retry absorbs that, so the
      # failure alert below only fires when the deploy fails twice in a row.
      - name: Deploy to GitHub Pages
        id: deploy
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Wait before deploy retry
        if: steps.deploy.outcome == 'failure'
        run: sleep 90

      - name: Retry Pages deploy (transient failure)
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v5

      # Pipeline observability — alert on any failed run. Prefers the incoming
      # webhook (SLACK_WEBHOOK_URL, already used for digests), falls back to a
      # bot token; no-ops when neither is configured.
      - name: Notify Slack on failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_ALERT_CHANNEL: ${{ vars.OPS_SLACK_CHANNEL }}
          ALERT_TEXT: ":rotating_light: ${{ github.repository }} / ${{ github.workflow }} failed (${{ github.event_name }}${{ github.event.action && format(' {0}', github.event.action) || '' }}${{ github.run_attempt != '1' && format(', attempt {0}', github.run_attempt) || '' }}): ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}${{ github.run_attempt != '1' && format('/attempts/{0}', github.run_attempt) || '' }}"
        run: |
          # Ops alerts belong in the channel OPS_SLACK_CHANNEL names, so the
          # explicit channel wins over the webhook. The webhook is bound to
          # #toread at creation and cannot be redirected from here; it stays
          # only as a last resort for a repo with no bot token.
          if [ -n "$SLACK_BOT_TOKEN" ] && [ -n "$SLACK_ALERT_CHANNEL" ]; then
            resp=$(jq -n --arg ch "$SLACK_ALERT_CHANNEL" --arg text "$ALERT_TEXT" '{channel: $ch, text: $text}' \
              | curl -s -X POST -H "Authorization: Bearer $SLACK_BOT_TOKEN" -H 'Content-Type: application/json' \
                  -d @- https://slack.com/api/chat.postMessage)
            # chat.postMessage answers HTTP 200 with {"ok":false} for a channel the
            # bot is not in, so curl -f cannot see it and `|| true` would bury it.
            [ "$(jq -r '.ok' <<<"$resp")" = "true" ] \
              || echo "::error::Slack rejected the failure alert: $resp"
          elif [ -n "$SLACK_WEBHOOK_URL" ]; then
            jq -n --arg text "$ALERT_TEXT" '{text: $text}' \
              | curl -sf -X POST -H 'Content-Type: application/json' -d @- "$SLACK_WEBHOOK_URL" \
              || echo "::error::Slack webhook rejected the failure alert"
          else
            echo "No Slack credentials configured — skipping failure alert"
          fi
