name: Update vault

on:
  # Pipeline chain (see PIPELINE.md). fg-zettelkasten runs twice:
  #   pipeline-summarize (from toread)    -> `summarize`, then kick research-radio
  #   pipeline-finalize  (from github.io) -> `update` (themes, notes, Slack)
  repository_dispatch:
    types: [pipeline-summarize, pipeline-finalize]
  schedule:
    - cron: "0 5 * * *"      # daily fallback in case a dispatch is missed
    - cron: "0 4 * * 1"      # weekly Mon 04:00 UTC — refresh topics + recluster
  workflow_dispatch:
    inputs:
      recluster:
        description: "Force a full recluster"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write          # deploy the Quartz site to GitHub Pages
  id-token: write       # required by actions/deploy-pages

# Run JS actions on Node 24. Node 20 is deprecated on GitHub runners (forced
# off 2026-06-02); some actions here (deploy-pages, upload-pages-artifact)
# have no Node-24 release yet, so opt in explicitly. No-op once Node 24 is
# the runner default — safe to drop then.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

# Avoid overlapping runs (dispatch + cron)
concurrency:
  group: update-vault
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        # requirements.lock is compiled from requirements.txt (uv pip compile);
        # regenerate it when requirements.txt changes.
        run: pip install -r requirements.lock

      - name: Write Google service-account credentials
        run: printf '%s' '${{ secrets.GOOGLE_CREDENTIALS_JSON }}' > credentials.json

      - name: Run
        env:
          # Authenticates feed_client's GitHub Contents API reads, lifting the
          # rate limit from 60/h (shared-runner-IP, exhausted by other tenants
          # -> intermittent 403) to 5000/h per token.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_APPLICATION_CREDENTIALS: ./credentials.json
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          # Team fork: mine-toread uploads team-submitted PDFs here and
          # main.py searches it alongside the Paperpile folder. Unset on the
          # fg chain (harmless empty).
          SLACK_INBOX_DRIVE_FOLDER_ID: ${{ secrets.SLACK_INBOX_DRIVE_FOLDER_ID }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ "${{ github.event.action }}" = "pipeline-summarize" ]; then
            python -m src.main summarize
          elif [ "${{ github.event.schedule }}" = "0 4 * * 1" ] || [ "${{ inputs.recluster }}" = "true" ]; then
            python -m src.main refresh-topics
            python -m src.main update --recluster
          else
            python -m src.main update
          fi

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add vault/ data/
          git diff --staged --quiet || git commit -m "🤖 Update vault $(date -u +%Y-%m-%dT%H:%MZ)"
          git push

      # Summarize leg only: kick research-radio so it builds the podcast from
      # the summary just committed. The update leg ends the chain — no dispatch.
      - name: Trigger research-radio
        if: github.event.action == 'pipeline-summarize'
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.PIPELINE_DISPATCH_TOKEN }}
          repository: fabiogiglietto/research-radio
          event-type: pipeline-tick

      # Publish the vault as a public website (Quartz -> GitHub Pages).
      # Built fresh from the working tree just committed above; the generated
      # HTML is never committed.
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Export vault to Quartz content
        run: python -m src.main export-site

      - name: Build Quartz site
        working-directory: quartz
        run: |
          npm ci
          npx quartz build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: quartz/public

      # Pages deploys fail transiently on the service side ("Deployment
      # failed, try again later") — e.g. 2026-07-03, three sites, all
      # recovered on plain retry. One automatic retry absorbs that, so the
      # failure alert below only fires when the deploy fails twice in a row.
      - name: Deploy to GitHub Pages
        id: deploy
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Wait before deploy retry
        if: steps.deploy.outcome == 'failure'
        run: sleep 90

      - name: Retry Pages deploy (transient failure)
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v5

      # Pipeline observability — alert on any failed run. Prefers the incoming
      # webhook (SLACK_WEBHOOK_URL, already used for digests), falls back to a
      # bot token; no-ops when neither is configured.
      - name: Notify Slack on failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_ALERT_CHANNEL: ${{ vars.OPS_SLACK_CHANNEL }}
          ALERT_TEXT: ":rotating_light: ${{ github.repository }} / ${{ github.workflow }} failed (${{ github.event_name }} ${{ github.event.action }}): ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: |
          if [ -n "$SLACK_WEBHOOK_URL" ]; then
            jq -n --arg text "$ALERT_TEXT" '{text: $text}' \
              | curl -sf -X POST -H 'Content-Type: application/json' -d @- "$SLACK_WEBHOOK_URL" || true
          elif [ -n "$SLACK_BOT_TOKEN" ] && [ -n "$SLACK_ALERT_CHANNEL" ]; then
            jq -n --arg ch "$SLACK_ALERT_CHANNEL" --arg text "$ALERT_TEXT" '{channel: $ch, text: $text}' \
              | curl -sf -X POST -H "Authorization: Bearer $SLACK_BOT_TOKEN" -H 'Content-Type: application/json' \
                  -d @- https://slack.com/api/chat.postMessage || true
          else
            echo "No Slack credentials configured — skipping failure alert"
          fi
