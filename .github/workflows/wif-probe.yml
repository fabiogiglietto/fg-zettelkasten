# TEMPORARY — Workload Identity Federation bring-up probe.
# Dumps the GitHub OIDC claims this repo's jobs actually present, so the
# Anthropic federation rule can be authored against real values instead of
# the doc's example `sub` shapes. Delete once the migration is verified.
# See ANTHROPIC_AUTH_MIGRATION.md section 5a.
name: WIF claims probe

on: workflow_dispatch

permissions:
  id-token: write
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    # Mirrors the `update` job in update-vault.yml. Naming an environment
    # changes the OIDC `sub` claim to repo:<owner>/<repo>:environment:<name>,
    # so the probe must declare it to observe the real subject.
    environment: github-pages
    steps:
      - name: Dump OIDC claims
        run: |
          curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://api.anthropic.com" \
            | jq -r .value > /tmp/jwt
          echo "--- claims ---"
          jq -rR 'split(".")[1] | gsub("-";"+") | gsub("_";"/") | @base64d | fromjson
                  | {iss,sub,aud,ref,repository,repository_owner,event_name,workflow}' < /tmp/jwt

      # Proves the federation rule end to end: exchange the JWT for a
      # short-lived Anthropic token and make one real Messages call. Runs with
      # no ANTHROPIC_API_KEY in the environment, so a success here can only
      # have come from the federated credential.
      - name: Exchange and call
        env:
          ANTHROPIC_FEDERATION_RULE_ID:  ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          ANTHROPIC_ORGANIZATION_ID:     ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          ANTHROPIC_SERVICE_ACCOUNT_ID:  ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          ANTHROPIC_IDENTITY_TOKEN_FILE: /tmp/jwt
        run: |
          test -n "$ANTHROPIC_FEDERATION_RULE_ID" || { echo "rule id variable is empty"; exit 1; }
          pip install --quiet anthropic
          python - <<'PY'
          import anthropic
          m = anthropic.Anthropic().messages.create(
              model="claude-opus-5", max_tokens=16,
              messages=[{"role": "user", "content": "reply with the single word OK"}],
          )
          print("federated call OK ->", next(b.text for b in m.content if b.type == "text"))
          PY
