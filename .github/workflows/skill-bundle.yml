name: Skill bundle

# Keep the skill upload bundle (Claude.ai / Cowork) in sync with its source
# under .claude/skills/zettel-paper/. Runs when the skill source, the `skill:`
# config block, or the build script changes on main; rebuilds the zip with
# scripts/build_skill_bundle.py (which retargets it from config — a fork ships
# its own skill) and commits it back if it differs.
on:
  push:
    branches: [main]
    paths:
      - ".claude/skills/zettel-paper/**"
      - "config.yml"
      - "scripts/build_skill_bundle.py"
  workflow_dispatch:

permissions:
  contents: write

# Serialize with itself; the bot commit below can't recurse (pushes made with
# GITHUB_TOKEN don't trigger workflows) and touches only the zip at the repo root.
concurrency:
  group: skill-bundle
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Rebuild bundle
        run: |
          pip install -q "PyYAML>=6.0.3"
          python -m scripts.build_skill_bundle

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          bundle=$(python -c "import yaml; print((yaml.safe_load(open('config.yml')).get('skill') or {}).get('bundle', 'zettel-paper-skill.zip'))")
          git add "$bundle"
          if git diff --staged --quiet; then
            echo "Bundle already up to date — nothing to commit."
          else
            git commit -m "🤖 Rebuild zettel-paper skill bundle"
            git pull --rebase origin main
            git push
          fi
